# 사용자 발화에서 산책 테마 태그를 추출하는 프롬프트.
# 태그 의미 가이드 기반으로, 일반어·유사어도 의미가 통하면 매핑한다.
_type: prompt
input_variables: ["user_input", "tag_keys"]
template: |
  사용자 발화에서 표현된 산책 취향을, 아래 [태그 의미 가이드]를 참고해 해당 태그로 매핑하세요.

  [태그 의미 가이드]
  - 자연/식물: 나무 많은, 꽃길, 햇살 좋은, 그늘이 많은, 초록(숲·녹지), 분홍(벚꽃·꽃), 노랑(은행·단풍), 파랑(강·호수·바다)
      → "자연친화적 / 자연 / 녹지 / 숲 / 공원 / 나무" = 나무 많은 (또는 초록)
  - 안전: 밤에도 안전한, 큰길, 밝은 길  /  좁은 골목 선호 = 골목골목
  - 편하게 걷기(경사 적음): 숨 안 차는, 평탄한
  - 활동/운동: 뛰고 싶은, 운동  (러닝·조깅·달리기·뛰다 = 뛰고 싶은 + 운동)
  - 볼거리/분위기: 볼거리 많은, 인스타 감성, 힙한(트렌디), 야경이 예쁜, 활기찬(사람 많고 활기)
      /  한적·조용 = 조용한, 사색하기 좋은
  - 동반: 어린이, 반려동물(강아지·반려견), 유모차, 휠체어

  규칙:
  - 사용자가 위 의미를 표현한 경우, **일반어·유사어라도 의미가 통하면** 해당 태그를 고르세요.
    (예: 자연친화적→["나무 많은","초록"], 한적한→["조용한"], 조깅→["뛰고 싶은","운동"], 강아지랑→["반려동물"])
  - 단, "산책 / 걷기 / 몇 km / 출발지 / 목적지 / 순환" 같은 **일반 표현만으로는 아무것도 고르지 마세요.**
    표현된 취향이 없으면 반드시 빈 배열 []을 반환하세요. (없는 게 정상)
  - 출력은 반드시 아래 [태그 목록]에 있는 **정확한 문자열**만 사용하세요. 목록에 없는 단어는 만들지 마세요.

  [빈 배열인 예]
  - "구파발역에서 3km 순환 산책하고 싶어"            → []
  - "강남역까지 걸어갈래"                            → []
  - "여의도공원까지 4km로 걷고 싶어"                 → []
  [매핑 예]
  - "자연친화적인 길로 걷고 싶어"                    → ["나무 많은", "초록"]
  - "밤에도 안전한 큰길로 가줘"                      → ["밤에도 안전한", "큰길"]
  - "조깅하기 좋은 코스로"                          → ["뛰고 싶은", "운동"]

  [태그 목록]: {tag_keys}
  [사용자 발화]: {user_input}

  설명 없이 JSON 배열만 출력하세요.
