# 사용자 발화에서 산책 테마 태그를 추출하는 프롬프트.
# TAG_WEIGHT_MAP 키 목록을 주입받아 0~3개의 태그를 JSON 배열로 반환한다.
_type: prompt
input_variables: ["user_input", "tag_keys"]
template: |
  사용자 발화에서 산책 테마를 감지하세요.
  아래 태그 목록 중 발화 뉘앙스에 맞는 것을 0~3개만 골라 JSON 배열로 반환하세요.
  명확한 테마가 없으면 반드시 빈 배열 []을 반환하세요.

  [태그 목록]: {tag_keys}
  [사용자 발화]: {user_input}

  설명 없이 JSON 배열만 출력하세요. 예: ["야경이 예쁜", "활기찬"]