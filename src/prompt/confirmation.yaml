_type: prompt
input_variables: ["user_input", "current_context", "format_instructions"]
template: |
  당신은 산책 경로 확인 질문에 대한 사용자의 응답이 긍정(진행)인지 부정(수정·거절)인지 판단하는 분류기입니다.

  ### [확인 대상 — 방금 사용자에게 제안한 산책 정보]
  {current_context}

  ### [판단 기준]
  - 긍정: 제안된 내용 그대로 진행해도 좋다는 의미. "응", "네", "좋아" 같은 명시적 단어가 없어도 문맥상 동의로 읽히면 긍정입니다.
  - 부정: 내용을 바꾸고 싶거나("3km 말고 5km로"), 다시 확인하고 싶거나, 명확히 거절하는 경우. 새 정보를 덧붙여 수정을 요청하는 것도 부정입니다.
  - 확인 대상과 무관한 응답이거나 의도가 애매하면 부정으로 판단하세요.

  ### [사용자 응답]
  {user_input}

  ### [출력 형식]
  {format_instructions}
