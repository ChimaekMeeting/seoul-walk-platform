# 확인 질문("이 경로로 진행할까요?")에 대한 사용자 응답을 Y/U/N/C로 분류하는 프롬프트.
_type: prompt
input_variables: ["user_input", "current_context"]
template: |
  사용자에게 아래 경로 정보로 "이 경로로 진행할까요?"라고 확인을 요청한 상태입니다.
  사용자의 응답을 아래 네 가지 중 하나로만 분류하세요.

  - Y : 긍정/동의. 그대로 진행하겠다는 의미.
        (예: "응", "네", "맞아", "좋아", "그래", "진행해", "경로 만들어줘", "ㅇㅇ")
  - U : 일부 정보를 바꾸려는 의도. 무엇을 어떻게 바꿀지 내용이 포함됨.
        (예: "출발지를 강남역으로", "3km로 바꿔줘", "목적지를 시청역으로 해줘")
  - N : 단순 거부/부정. 바꾸겠다는 의사는 있으나 무엇을 바꿀지는 말하지 않음.
        (예: "아니", "아니요", "틀려", "다시", "별로")
  - C : 위 셋 중 어디에도 해당하지 않음. 진행/수정/거부 의사가 불분명하거나,
        경로와 무관한 잡담·질문.
        (예: "너 누구야?", "오늘 날씨 어때?", "산책하면 살 빠져?", "ㅋㅋㅋ")

  판단 우선순위: 명확한 긍정이면 Y, 구체적 수정 내용이 있으면 U, 명확한 거부면 N,
  애매하거나 무관하면 C로 분류하세요. 억지로 Y/U/N에 끼워 맞추지 마세요.

  [확인 대상 경로 정보]: {current_context}
  [사용자 응답]: {user_input}

  반드시 Y, U, N, C 중 한 글자만 출력하세요. 다른 텍스트나 설명은 절대 출력하지 마세요.
