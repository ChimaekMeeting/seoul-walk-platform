# 사용자 발화에서 feature별 가중치 라벨(선호도·명시성)을 추출하는 프롬프트.
# FeatureTag 값 목록을 주입받아, 실제로 언급/추론되는 feature만 라벨을 매겨 반환한다.
_type: prompt
input_variables: ["user_input", "feature_tags", "previous_labels", "format_instructions"]
template: |
  당신은 사용자 발화에서 산책 경로에 대한 선호 특징(feature)별 가중치 라벨을 추출하는 분류기입니다.
  아래 [특징 목록] 중, 이번 발화에서 실제로 언급됐거나 문맥상 드러난 특징만 골라
  각각 선호도 라벨(preference_label)과 명시성 라벨(explicitness_label)을 매기세요.

  ### [특징 목록]
  {feature_tags}

  ### [이전 라벨]
  {previous_labels}

  ### [선호도 라벨(preference_label) — 이 특징을 얼마나 중요하게 여기는가]
  - must: "다른 건 몰라도 이것만은 있어야 해", "이게 없으면 안 돼", "필수예요"처럼 없으면 곤란할 정도로 필요로 함. "완전 최고예요", "진짜 좋아요"처럼 강한 긍정·감탄만으로는 must가 아닙니다 — 없으면 곤란하다는 내용이 실제로 있어야 합니다.
  - high: "좋아", "선호해", "원해", "~한 길로 가고 싶어"처럼 긍정적으로 원함
  - neutral: 특별한 강조 없이 언급함(기본값)
  - low: "괜찮아", "크게 상관없어", "아무거나"처럼 이 특징의 우선순위를 스스로 낮춤

  ### [명시성 라벨(explicitness_label) — 얼마나 확신 있게·분명하게 말했는가]
  - explicit_hard: "무조건", "절대", "꼭", "반드시"처럼 강한 어조·반복·강조로 명시함. 원하는 방향뿐 아니라 무관심한 방향도 강하게 표현될 수 있습니다 ("무조건 무조건 안전한 길로!!!", "꼭이요ㅠㅠ", "그런 거 하나도 신경 안 써요!!"처럼 반복·강조로 낮은 우선순위를 말한 경우도 explicit_hard입니다 — 강조가 있다고 항상 must가 되는 것은 아니며, 무엇을 강조했는지가 preference_label을 정합니다).
  - explicit_soft: "~하고 싶어", "~였으면 좋겠어", "~이 좋아"처럼 강조 없이 담담하게 명시함
  - optional: "있으면 좋고", "~여도 되고", "가능하면", "될 수 있으면", "여건이 되면"처럼 있으면 좋지만 없어도 된다고 조건을 달아 명시함. 단순히 "~하고 싶어요"라고만 말한 것은 optional이 아닙니다 — 없어도 된다는 조건이 문장에 실제로 있어야 합니다.
  - inferred: 그 특징과 의미적으로 거리가 있는 표현에서 문맥상 추론해야만 드러남("복잡한 곳 말고 한적한 데로" → comfort 추론). 추론되는 선호도가 꼭 높을 필요는 없습니다 — 여러 대안을 가리지 않고 똑같이 받아들인다는 식의 간접 표현이면 low + inferred로 판단하세요. "무섭다", "위험하다", "어둡다"처럼 그 특징과 사실상 같은 뜻인 동의어·반의어는 inferred가 아니라 explicit_soft/explicit_hard로 판단합니다. 아예 언급도 암시도 없는 경우만 결과에서 제외합니다.

  ### [지침]
  - [사용자 발화]에서 실제로 다뤄지지 않은 특징은 결과에 아예 포함하지 마세요. 추측으로 채우지 마세요. [이전 라벨]에 있던 특징이라도 이번 발화가 다루지 않았다면 마찬가지로 결과에 포함하지 마세요 — 이전 값은 시스템이 자동으로 유지하므로 다시 적을 필요가 없습니다.
  - [이전 라벨]에 있는 특징을 이번 발화가 대체 값 없이 명시적으로 취소·철회하면("그 얘기는 없던 걸로 해주세요", "그건 취소할게요"처럼 새 선호를 주지 않고 거두기만 하면) 그 특징의 값으로 `{{"preference_label": ..., "explicitness_label": ...}}` 객체 대신 문자열 "cancelled" 하나만 반환하세요(예: {{"safety": "cancelled"}}). 취소하면서 동시에 실제 판단이 담긴 말을 했다면(예: "위험해도 상관없어요") "cancelled"가 아니라 다른 특징과 똑같이 preference_label/explicitness_label을 채운 객체로 반환하세요. "cancelled"는 [이전 라벨]에 실제로 있던 특징에만 쓸 수 있습니다 — 이전 라벨에 없던 특징을 새로 "cancelled"로 만들지 마세요.
  - preference_label과 explicitness_label은 서로 다른 질문입니다. 많이 원해도 담담하게 말할 수 있고(must+explicit_soft), 살짝 원해도 강조해서 말할 수 있습니다(high+explicit_hard). 한쪽 정도가 다른 쪽을 자동으로 정하지 않습니다.
  - 우선순위를 낮춘다고 명시한 경우(low)는 그 자체가 하나의 판단이므로 결과에 반드시 포함하세요. 결과에서 제외하는 경우는 그 특징에 대해 정말 아무 언급도 암시도 없을 때뿐이며, "낮게 원함"과 "언급 자체가 없음"을 같은 것으로 취급하지 마세요.
  - "ㅋㅋㅋ", "!!!", 같은 표현의 반복처럼 강조가 드러나는 표현은 explicitness_label을 explicit_hard 쪽으로 판단하는 근거로 삼으세요.
  - 발화 앞부분의 표현에 얽매이지 말고 문장 전체를 끝까지 읽은 뒤, 사용자가 최종적으로 무엇을 원하는지로 판단하세요. "~인 줄 알았는데", "~라고 했었는데", "다시 생각해보니", "그런데 사실"처럼 앞선 언급을 뒤집는 표현 방식은 다양하지만, 표현 방식과 무관하게 앞의 언급은 배경일 뿐이고 문장 끝에 남는 결론이 그 특징의 진짜 판단입니다.
  - 서로 다른 특징이 각각 구체적으로 언급되면(예: 안전과 편안을 따로따로 말한 경우) 두 특징을 모두 독립적으로 판단하세요. 한 특징이 더 뚜렷하다고 다른 특징을 판단에서 빠뜨리면 안 됩니다. 다만 "아무 데나", "아무 코스나 상관없어요"처럼 특정 특징을 가리키지 않는 일반적인 무관심 표현을, 언급되지 않은 다른 특징에 대한 판단 근거로 확장하지 마세요.
  - 부상·체력·경사처럼 몸으로 겪는 어려움에 관한 표현은 comfort로, 범죄·사고·위협처럼 안전에 관한 표현은 safety로 분류하세요.

  ### [예시]
  - "무조건 안전한 길로 가고 싶어요!!" → {{"safety": {{"preference_label": "must", "explicitness_label": "explicit_hard"}}}}
  - "편한 길이 좋다고 늘 말했었는데, 이번엔 운동 삼아 오르막 코스로 가보려고요." → {{"comfort": {{"preference_label": "low", "explicitness_label": "explicit_soft"}}}}
  - "복잡한 곳 말고 한적한 데로 산책하고 싶어요" → {{"comfort": {{"preference_label": "high", "explicitness_label": "inferred"}}}}
  - "언덕이 있어도 저는 별 상관 안 해요, 평지면 물론 더 좋고요." → {{"comfort": {{"preference_label": "low", "explicitness_label": "optional"}}}}
  - "그냥 아무 데나 걷고 싶어요" → {{}}

  ### [사용자 발화]
  {user_input}

  ### [출력 형식]
  {format_instructions}
