[tool.poetry]
name = "seoul-walk-platform"
package-mode = false 
version = "0.1.0"
description = "서울시 산책 경로 추천 서비스"
authors = ["Seoul Walk Team"]

[tool.poetry.dependencies]
python = "^3.11"

# --- Graph (직접 의존성으로 승격, 버전 핀 고정) ---
# artifact manifest python_version=3.12.13, networkx_version=3.6
# 로더가 major.minor를 검증하므로 3.6.x 고정 필수
networkx = "3.6"

# --- Data & Geometry (API 런타임 필수) ---
pandas = "^2.2.0"
geopandas = "^0.14.0"
shapely = "^2.0.0"
h3 = "^4.0.0"

# --- API & Backend Core ---
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic-settings = "^2.0.0"

# --- Database & Cache ---
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.9"
redis = "^5.0.0"

# --- Client & AI ---
requests = "^2.32.0"
httpx = "^0.27.0"
openai = "^1.30.0"
python-dotenv = "^1.0.1"
geoalchemy2 = "^0.18.4"
openpyxl = "^3.1.5"

# --- LangChain Ecosystem ---
langchain = "^0.3.0"
langchain-core = "^0.3.0"
langchain-community = "^0.3.0"
langchain-openai = "^0.2.0"
beautifulsoup4 = "^4.14.3"
langgraph = ">=0.2.0,<1.0.0"

# --- UI (Streamlit 프로토타입 전용 — API 이미지에서 제외) ---
[tool.poetry.group.ui]
optional = true

[tool.poetry.group.ui.dependencies]
streamlit = "^1.40.0"
pydeck = "^0.9.0"
folium = "^0.17.0"
streamlit-folium = "^0.21.0"
extra-streamlit-components = "^0.1.71"
streamlit-modal = "^0.1.2"
matplotlib = "^3.11.0"

# --- Data Pipeline (그래프 빌드·수집 전용 — API 이미지에서 제외) ---
[tool.poetry.group.data]
optional = true

[tool.poetry.group.data.dependencies]
osmnx = "^1.9.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.4.0"
ipykernel = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.analysis.dependencies]
jupyter = "^1.0.0"
seaborn = "^0.13.0"
pyyaml = "^6.0.0"
matplotlib = "^3.9.0"